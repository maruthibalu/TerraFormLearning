name: Deploy Azure Bicep

on:
  push:
    branches:
      - main
    paths:
      - "Azure/**"
      - ".github/workflows/azure-deploy.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Azure production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: azure-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: az bicep install

      - name: Verify production configuration
        shell: bash
        env:
          AZURE_PROD_RESOURCE_GROUP: ${{ vars.AZURE_PROD_RESOURCE_GROUP }}
        run: |
          if [ -z "$AZURE_PROD_RESOURCE_GROUP" ]; then
            echo "::error::Repository variable AZURE_PROD_RESOURCE_GROUP is not configured."
            exit 1
          fi

          echo "Target resource group: $AZURE_PROD_RESOURCE_GROUP"

      - name: Build production template
        run: |
          az bicep build \
            --file Azure/main.bicep \
            --stdout > /dev/null

      - name: Build production parameters
        run: |
          az bicep build-params \
            --file Azure/environments/prod.bicepparam \
            --stdout > /dev/null

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure context
        run: |
          az account show --output table

          az group show \
            --name "${{ vars.AZURE_PROD_RESOURCE_GROUP }}" \
            --output table

      - name: Validate production deployment
        run: |
          az deployment group validate \
            --resource-group "${{ vars.AZURE_PROD_RESOURCE_GROUP }}" \
            --parameters Azure/environments/prod.bicepparam

      - name: Preview production deployment
        run: |
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_PROD_RESOURCE_GROUP }}" \
            --parameters Azure/environments/prod.bicepparam

      - name: Deploy production resources
        run: |
          az deployment group create \
            --name "prod-${{ github.run_number }}" \
            --resource-group "${{ vars.AZURE_PROD_RESOURCE_GROUP }}" \
            --parameters Azure/environments/prod.bicepparam \
            --mode Incremental